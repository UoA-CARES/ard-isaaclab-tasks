params:
  seed: 42

  # environment wrapper clipping
  env:
    # added to the wrapper
    clip_observations: 5.0
    # can make custom wrapper?
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  # doesn't have this fine grained control but made it close
  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None

        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [512, 512, 256, 128]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False # flag which sets whether to load the checkpoint
  load_path: '' # path to the checkpoint to load

  config:
    name: shadow_hand
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: -1  # configured from the script (based on num_envs)
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.99
    tau : 0.95
    learning_rate: 5e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 100000
    max_epochs: 5000
    save_best_after: 100
    save_frequency: 200
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 16
    minibatch_size: 32768
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    seq_length: 4
    bounds_loss_coef: 0.0001

    # Neuron-level plasticity diagnostics (rl_games NetworkPlasticityManager).
    # Interval units are summary() calls, i.e. epochs.
    plasticity:
      enabled: false
      replacement_enabled: false          # CBP neuron replacement - not implemented yet
      replacement_strategy: cbp

      # Replacement schedule (accepted, inert until replacement lands)
      replacement_rate: 1.0e-5
      maturity_threshold: 1000
      activation_window_size: 10000

      # Diagnostics schedule
      log_interval: 1                    # epochs between logged summaries
      rank_interval: 1                   # epochs between rank computations
      knife_interval: 10                   # multiples of log_interval between KNIFE diagnostics

      utility_decay: 0.99

      stagnant_threshold: 0.25
      volatile_threshold: 3.0
      rua_eps: 1.0e-12

      activity_threshold: 1.0e-5
      dormant_threshold: 0.01

      # Rows kept from a single [num_envs, hidden] rollout forward pass
      rollout_samples_per_forward: 256

      replacement_accumulate: false
      compute_rank: true
      training_only: true

      init: kaiming
      activation_name: elu                # must match network.mlp.activation

    player:
      deterministic: True
      games_num: 100000
      print_stats: True
